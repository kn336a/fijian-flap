<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1d2b24">
<title>Fijian Flap</title>
<meta name="description" content="Fijian Flap: an 8-bit flappy adventure with a dinosaur, a fairy, power-ups and a cheering crowd. Tap to flap!">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Fijian Flap">
<meta property="og:title" content="Fijian Flap - tap to flap!">
<meta property="og:description" content="Dodge the cans, grab Fiji Water and power-ups, and beat your friends' scores. Play free in your browser.">
<meta property="og:url" content="https://kn336a.github.io/fijian-flap/">
<meta property="og:image" content="https://kn336a.github.io/fijian-flap/assets/ui/cover.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Fijian Flap title with a dinosaur and a fairy flying over green hills">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Fijian Flap - tap to flap!">
<meta name="twitter:description" content="Dodge the cans, grab Fiji Water and power-ups. Play free in your browser.">
<meta name="twitter:image" content="https://kn336a.github.io/fijian-flap/assets/ui/cover.png">
<link rel="apple-touch-icon" href="assets/ui/icon-180.png">
<link rel="icon" type="image/png" href="assets/ui/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&display=swap" rel="stylesheet">
<style>
  html, body {
    margin: 0; height: 100%; background: #1d2b24; overflow: hidden;
    overscroll-behavior: none; touch-action: none;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
  }
  /* Wrapper keeps the game inside notches / home bars on phones */
  #wrap {
    position: fixed;
    top: env(safe-area-inset-top); right: env(safe-area-inset-right);
    bottom: env(safe-area-inset-bottom); left: env(safe-area-inset-left);
    display: flex; align-items: center; justify-content: center;
  }
  canvas { display: block; background: #bfe9f5; touch-action: none; }
</style>
</head>
<body>
<div id="wrap"><canvas id="game" width="400" height="700"></canvas></div>
<script src="game.js"></script>
</body>
</html>
